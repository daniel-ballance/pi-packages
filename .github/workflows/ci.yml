name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.package-manager }}, Node ${{ matrix.node }}, Pi 1.3.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm]
        node: [22.23.3, 26.12.0]
    env:
      PACKAGE_MANAGER: ${{ matrix.package-manager }}
      # pnpm's store does not prime npm's cache for Pi's Git installer test.
      PI_PACKAGING_NPM_OFFLINE: ${{ matrix.package-manager == 'npm' && 'true' || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Set up npm
        run: npm install --global npm@12.2.0 --ignore-scripts

      - name: Set up pnpm
        if: matrix.package-manager == 'pnpm'
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0

      - name: Show runtime
        run: node --version && npm --version && "$PACKAGE_MANAGER" --version

      - name: Install package dependencies
        run: ./scripts/ci-install.sh locked

      - name: Run root check
        run: ./scripts/check.sh
