packages:
  - 'packages/*'
  - 'packages/p3stack/*'
  - 'scripts/lint-skill'

# Pi supplies runtime peers. Development copies are explicitly declared.
autoInstallPeers: false

# Match the npm --ignore-scripts installation contract.
ignoreScripts: true
allowBuilds:
  '@google/genai': false
  esbuild: false
  protobufjs: false

# The owner takes the latest stable release as soon as it ships.
minimumReleaseAge: 0

# Checks must not reinstall dependencies (including CI's temporary Pi override).
verifyDepsBeforeRun: false

# Published legacy SDK manifests pin an insecure undici version exactly.
# Replace only vulnerable 8.x releases; retain every Pi/other dependency pin.
overrides:
  'undici@>=8.0.0 <8.10.2': '8.10.2'
