packages:
  - 'packages/*'
  - 'scripts/lint-skill'

# Pi supplies runtime peers. Development copies are explicitly declared.
autoInstallPeers: false

# Match the npm --ignore-scripts installation contract.
ignoreScripts: true
allowBuilds:
  '@google/genai': false
  esbuild: false
  protobufjs: false

# Explicitly requested/verified Pi release. Keep pnpm's age quarantine for every
# other version/package; no wildcard exclusions and no global age-check bypass.
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@1.3.0'
  - '@earendil-works/pi-ai@1.3.0'
  - '@earendil-works/pi-codemode@1.3.0'
  - '@earendil-works/pi-coding-agent@1.3.0'
  - '@earendil-works/pi-mcp@1.3.0'
  - '@earendil-works/pi-telemetry@1.3.0'
  - '@earendil-works/pi-tui@1.3.0'

# Checks must not reinstall dependencies (including CI's temporary Pi override).
verifyDepsBeforeRun: false

# Published legacy SDK manifests pin an insecure undici version exactly.
# Replace only vulnerable 8.x releases; retain every Pi/other dependency pin.
overrides:
  'undici@>=8.0.0 <8.10.2': '8.12.2'
